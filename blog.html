<script>
// ------------------------------------------------------------------
// 文章清單：每寫一篇新文章，先照 post-template.html 複製改好，
// 存到 posts 資料夾（例如 posts/2026-09-上板教學.html），
// 再回來這裡新增一筆物件即可，新文章建議加在陣列最上面（最新的在前面）。
// - title：文章標題
// - date：發布日期，顯示用
// - excerpt：摘要，一兩句話，會顯示在卡片上
// - cover：封面圖片路徑，沒有的話可以留空字串 ""
// - url：文章檔案的路徑
// ------------------------------------------------------------------
const posts = [
{
  title: "看懂鹿角蕨市場的縮寫與命名",
  date: "2026-09-08",
  excerpt: "收錄一些我自己曾經很難理解、或有人問過我的縮寫與寫法，不是標準答案，只是約定成俗的整理。",
  cover: "",
  url: "posts/2026-09-鹿角蕨密碼筆記.html"
},  
{
    title: "用泥炭土搶救鹿角蕨的方法",
    date: "2026-09-04",
    excerpt: "泥炭土竟然也可以種鹿角蕨？而且還是在鹿角蕨最脆弱的時候？",
    cover: "images/cv_at1.jpeg",
    url: "posts/post-example.html"
  },
];

const grid = document.getElementById('grid');

function render(){
  grid.innerHTML = posts.map(p => `
    <a class="card" href="${p.url}" style="text-decoration:none;color:inherit;display:block;">
      <div class="frond">${p.cover ? `<img src="${p.cover}" alt="${p.title}" loading="lazy">` : frondSVG('#5a6e46')}</div>
      <div class="body">
        <h3>${p.title}</h3>
        <div class="collection-note" style="padding:0;flex:1;">
          <div style="font-size:12px;opacity:.7;margin-bottom:6px;">${p.date}</div>
          ${p.excerpt}
        </div>
      </div>
    </a>
  `).join('');
}

render();
</script>
