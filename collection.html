<html lang="zh-Hant">
<head>

</head>
<body>

<nav class="site-nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-brand"><img src="images/wow-forest-logo.jpeg" alt="">植播電台<span class="brand-sub">Zhibodiantai</span></a>
    <div class="nav-links">

    </div>
    <button id="navToggle" class="nav-toggle" aria-label="開啟選單">☰</button>
  </div>
</nav>

<div class="wrap">
  <header class="page-head">
    <div class="eyebrow">Mother Plants & Notable Specimens</div>
    <h1>典藏收藏</h1>
    <p class="sub">這裡展示不販售的母本與表現優秀的個體，是販售目錄裡許多孢子苗、側芽的來源與參考依據。</p>
  </header>

  <div class="grid" id="grid"></div>
</div>

<footer class="site-footer">© 植播電台 Zhibodiantai · 個人栽培紀錄與販售</footer>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button id="modalClose">關閉 ✕</button>
    </div>
    <div class="modal-photos" id="modalPhotos"></div>
    <div class="modal-note" id="modalNote"></div>
  </div>
</div>

<script src="js/common.js"></script>
<script>
// ------------------------------------------------------------------
// 典藏收藏資料：每一筆代表一株母本或重點收藏個體
// - label：分類標籤，例如 "母本"、"重點收藏"、"型態參考"，會顯示成小標籤
// - photos：可放多張照片，例如 ["images/mother-m1-1.jpg","images/mother-m1-2.jpg"]
// - note：介紹文字，可以寫來源、型態特徵、為什麼留種等
// ------------------------------------------------------------------
const collection = [
  {
    id:"M-01",
    name:"個體 01（填名稱）",
    label:"母本",
    color:"#4c5f3d",
    photos:[],
    note:"（介紹文字：來源、型態特徵、為什麼留種等）"
  },
  {
    id:"M-02",
    name:"個體 02（填名稱）",
    label:"母本",
    color:"#5a6e46",
    photos:[],
    note:"（介紹文字）"
  },
  {
    id:"M-03",
    name:"個體 03（填名稱）",
    label:"母本",
    color:"#3f5232",
    photos:[],
    note:"（介紹文字）"
  },
  {
    id:"M-04",
    name:"個體 04（填名稱）",
    label:"母本",
    color:"#6b7c52",
    photos:[],
    note:"（介紹文字）"
  },
  {
    id:"C-01",
    name:"個體 05（填名稱）",
    label:"重點收藏",
    color:"#354a2b",
    photos:[],
    note:"（介紹文字）"
  },
  {
    id:"C-02",
    name:"個體 06（填名稱）",
    label:"重點收藏",
    color:"#4a5e3a",
    photos:[],
    note:"（介紹文字）"
  },
  {
    id:"C-03",
    name:"個體 07（填名稱）",
    label:"重點收藏",
    color:"#576b44",
    photos:[],
    note:"（介紹文字）"
  },
  {
    id:"C-04",
    name:"個體 08（填名稱）",
    label:"重點收藏",
    color:"#495c39",
    photos:[],
    note:"（介紹文字）"
  },
];

function galleryHTML(item, idx){
  const photos = item.photos && item.photos.length ? item.photos : [];
  if(photos.length === 0) return frondSVG(item.color);
  const nav = photos.length > 1 ? `
    <div class="nav prev" data-nav="prev" data-id="${item.id}">‹</div>
    <div class="nav next" data-nav="next" data-id="${item.id}">›</div>
    <div class="dots">${photos.map((_,i)=>`<span class="${i===idx?'active':''}"></span>`).join('')}</div>
  ` : '';
  return `<img src="${photos[idx]}" alt="${item.name}" loading="lazy">${nav}`;
}

let galleryIndex = {};
const grid = document.getElementById('grid');
const lightbox = initLightbox();

function render(){
  grid.innerHTML = collection.map(item => `
    <div class="card">
      <div class="accession">NO. ${item.id}</div>
      <div class="frond">${galleryHTML(item, galleryIndex[item.id] || 0)}</div>
      <div class="body">
        <h3>${item.name}${item.label ? `<span class="type-tag">${item.label}</span>` : ''}</h3>
        <div class="collection-note" style="padding:0;flex:1;">${item.note || ''}</div>
      </div>
    </div>
  `).join('');

  grid.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const item = collection.find(i=>i.id===btn.dataset.id);
      const len = item.photos.length;
      const cur = galleryIndex[item.id] || 0;
      galleryIndex[item.id] = btn.dataset.nav === 'next' ? (cur+1)%len : (cur-1+len)%len;
      render();
    });
  });

  grid.querySelectorAll('.frond img').forEach(img=>{
    img.style.cursor = 'zoom-in';
    img.addEventListener('click', ()=>{
      const card = img.closest('.card');
      const idx = [...grid.children].indexOf(card);
      lightbox.open(collection[idx]);
    });
  });
}

render();
</script>

</body>
</html>
